[project]
name = "deck-optimisation-engine"
version = "0.1.0"
description = "Mines published MTGO decklists to inform Goryo's deckbuilding decisions"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.32",
]

[project.scripts]
deck-engine = "deck_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deck_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
